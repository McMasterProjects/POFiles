

name: PO Converter - Automated Testing

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test PO Converter
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: excel2po-connect

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: excel2po-connect/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Tests
        run: npm test

      - name: Check Code Quality
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Confirm Success
        run: echo "PO Converter testing completed successfully!"
